<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATM Management System</title>
    <Style>
        body{
            text-align: center;
            background-color: rgba(47, 19, 235, 0.222);
            /* margin-top: 100px; */
            
        }
        marquee{
            font-size: 80px;
        }
        h1{
            height: fit-content;
            /* width: 50px; */
            text-align: center;
            border-radius: 10px;
            padding: 10px;
            border: solid 2px black;
            background-color:  rgb(35, 35, 210);
            color: white;
        }
        div{
            height: auto;
            width: auto;
            margin-top:40px;
        }
        input{
            height: 30px;
            width: 220px;
            border-radius: 20px;
            border: 2px solid black ;
            color:black;
            font-size: 20px;
            background-color: rgb(248, 248, 251);
            padding: 10px;
            margin-bottom: 20px;
        }
        button{
            height: 50px;
            width: 220px;
            border-radius: 20px;
            border: 2px solid black;
            background-color: aqua;
            font-size: 20px;
            padding: 10px;
            cursor: pointer;
        }
    </Style>
</head>
<body>
    <marquee scrollamount="30" behavior=""  direction="right to left">This banking system is fully secure don't worry your money is safe</marquee>
    <h1>ATM Management System</h1>
    <div class="Search">
    <input type="text" placeholder="Enter ATM Number"><br>
    <input type="password" placeholder="Enter Pin Number"><br>
    <button>Enter</button>
    </div>
</body>
</html>
